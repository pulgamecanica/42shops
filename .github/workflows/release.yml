name: CI & release

# Every PR and push to main is type-checked and built. A push to main whose
# package.json version has no tag yet becomes a GitHub release, named after
# CODENAME in the Makefile: bump both, merge, and the release appears.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make check

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version and codename
        id: meta
        run: |
          echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"
          echo "codename=$(make -s codename)" >> "$GITHUB_OUTPUT"
      - name: Create release if v${{ steps.meta.outputs.version }} is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}
          CODENAME: ${{ steps.meta.outputs.codename }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released, bump the version in package.json to ship a new one."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG “$CODENAME”" \
            --generate-notes
